services:
  codestation:
    build: .
    image: codestation:latest
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      S3_ROOM_PREFIX: ${S3_ROOM_PREFIX:-rooms}
    ports:
      - "80:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
