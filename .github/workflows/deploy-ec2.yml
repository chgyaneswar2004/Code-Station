name: Deploy CodeStation to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}
          script: |
            set -eu
            cd "${{ secrets.EC2_APP_PATH }}"
            git pull --ff-only origin main
            cd CodeStation
            docker compose up -d --build --remove-orphans
            docker image prune -f
            for attempt in 1 2 3 4 5 6; do
              if docker compose exec -T codestation node -e "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                exit 0
              fi
              sleep 5
            done
            docker compose logs --tail=100
            exit 1
